name: Publish to nuget.org

run-name: Publish release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# nuget.org versions are immutable. Do not publish two release tags at the same time, and do not cancel a
# workflow after it has started uploading a package.
concurrency:
  group: nuget-publish
  cancel-in-progress: false

env:
  # CI job names the release must have passed on the tagged commit before publishing. The V1 job name includes
  # the Milvus image version (matrix), so match its prefix. Keep in sync with the job names in Build.yml.
  CI_V2_CHECK: 'Build and test V2'
  CI_V2_WINDOWS_CHECK: 'Build and test V2 on Windows'
  CI_V1_CHECK_PREFIX: 'Build and test V1 with Milvus'

jobs:
  validate:
    name: Validate release commit
    if: github.repository == 'milvus-io/milvus-sdk-csharp'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      # A release tag must point at a commit that is already on some remote branch (main, 2.6, 3.0, ...) with a
      # green CI run on that commit, so a tag can never publish code that did not pass the required checks
      # (mirrors the Rust SDK's publish-release flow). The required checks are polled until they reach a
      # terminal conclusion: a tag is usually pushed right after the merge, so the CI runs may still be
      # in_progress when this workflow starts, and a one-shot query would spuriously fail on that race.
      - name: Verify tag ancestry and wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          if ! git branch -r --contains "${TAG_SHA}" | grep -q 'origin/'; then
            echo "Release tag commit ${TAG_SHA} is not contained in any remote branch." >&2
            exit 1
          fi
          echo "Release commit is contained in a remote branch."

          # Poll the check-runs API until each required CI check on the tagged commit reaches a terminal
          # conclusion, then require success. A release tag is usually pushed right after the merge, so the
          # CI runs may still be in_progress when this workflow starts; a one-shot query would fail on that
          # race.
          #
          # - Only the LATEST run per check name/leg decides the outcome: a stale success from an earlier
          #   attempt must not mask a newer failed run, and a stale failure must not fail the wait while a
          #   newer run is still queued/in_progress.
          # - Exact-name checks (V2, V2 on Windows): the latest run must be terminal and successful.
          # - Prefix checks (V1 matrix): every matching leg's latest run must be terminal and successful
          #   (all legs pass), consistent with the mergify all-legs gate.
          # - Any terminal non-success conclusion (failure/cancelled/timed_out/action_required/skipped/
          #   neutral/stale) fails fast instead of spinning to the deadline.
          # - A transient check-runs API error is logged and retried; 5 consecutive failures abort with the
          #   underlying error instead of silently retrying to the deadline.
          wait_for_ci() {
            local label="$1" name="$2" prefix="${3:-}"
            local consecutive_errors=0
            while (( SECONDS < wait_deadline )); do
              local check_runs api_err state started in_progress green legs all_terminal all_green
              if ! check_runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG_SHA}/check-runs?per_page=100" 2>/tmp/gh_api_err.$$)"; then
                api_err="$(cat /tmp/gh_api_err.$$ 2>/dev/null || true)"
                consecutive_errors=$((consecutive_errors + 1))
                echo "check-runs API error (${consecutive_errors} consecutive): ${api_err}" >&2
                if (( consecutive_errors >= 5 )); then
                  echo "Persistent check-runs API failure after ${consecutive_errors} consecutive errors; aborting." >&2
                  exit 1
                fi
                sleep 20
                continue
              fi
              consecutive_errors=0

              if [[ -n "${prefix}" ]]; then
                state="$(jq -r --arg prefix "${prefix}" --arg sha "${TAG_SHA}" '
                  [.check_runs[] | select((.name | startswith($prefix)) and .head_sha == $sha)]
                  | group_by(.name)
                  | { legs: length,
                      all_terminal: (all(.[]; all(.[]; .status == "completed"))),
                      all_green: (all(.[]; (max_by(.started_at) | .conclusion == "success"))) }
                ' <<<"${check_runs}")"
                legs="$(jq -r '.legs' <<<"${state}")"
                all_terminal="$(jq -r '.all_terminal' <<<"${state}")"
                all_green="$(jq -r '.all_green' <<<"${state}")"
                if (( legs == 0 )); then
                  echo "No ${label} check has started on ${TAG_SHA} (${SECONDS}s elapsed)..."
                  sleep 20
                  continue
                fi
                if [[ "${all_terminal}" != "true" ]]; then
                  echo "${label} check still running on ${TAG_SHA} (${SECONDS}s elapsed)..."
                  sleep 20
                  continue
                fi
                if [[ "${all_green}" == "true" ]]; then
                  echo "${label} check passed on ${TAG_SHA}."
                  return 0
                fi
                echo "A ${label} check failed on ${TAG_SHA}." >&2
                exit 1
              else
                state="$(jq -r --arg name "${name}" --arg sha "${TAG_SHA}" '
                  [.check_runs[] | select(.name == $name and .head_sha == $sha)]
                  | { started: (length > 0),
                      in_progress: (any(.[]; .status != "completed")),
                      green: ((length > 0) and (all(.[]; .status == "completed")) and ((max_by(.started_at) | .conclusion) == "success")) }
                ' <<<"${check_runs}")"
                started="$(jq -r '.started' <<<"${state}")"
                in_progress="$(jq -r '.in_progress' <<<"${state}")"
                green="$(jq -r '.green' <<<"${state}")"
                if [[ "${started}" != "true" ]]; then
                  echo "No ${label} check has started on ${TAG_SHA} (${SECONDS}s elapsed)..."
                  sleep 20
                  continue
                fi
                if [[ "${in_progress}" == "true" ]]; then
                  echo "${label} check still running on ${TAG_SHA} (${SECONDS}s elapsed)..."
                  sleep 20
                  continue
                fi
                if [[ "${green}" == "true" ]]; then
                  echo "${label} check passed on ${TAG_SHA}."
                  return 0
                fi
                echo "A ${label} check failed on ${TAG_SHA}." >&2
                exit 1
              fi
            done
            echo "Timed out waiting for the ${label} check to complete on ${TAG_SHA}." >&2
            exit 1
          }

          # A single shared 40-minute budget across all three required checks (within the 45-minute job
          # timeout): three sequential per-call 40-minute deadlines would overrun the job and get killed.
          wait_deadline=$((SECONDS + 2400))

          wait_for_ci "${{ env.CI_V2_CHECK }}" "${{ env.CI_V2_CHECK }}"
          wait_for_ci "${{ env.CI_V2_WINDOWS_CHECK }}" "${{ env.CI_V2_WINDOWS_CHECK }}"
          wait_for_ci "${{ env.CI_V1_CHECK_PREFIX }}" "" "${{ env.CI_V1_CHECK_PREFIX }}"
          echo "Required post-merge checks passed for ${TAG_SHA}."

  publish:
    name: Publish to nuget.org
    needs: validate
    if: github.repository == 'milvus-io/milvus-sdk-csharp'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # id-token: write is required for Trusted Publishing (GitHub OIDC). See the Trusted Publishing policy on
    # nuget.org (repository owner: milvus-io, repository: milvus-sdk-csharp, workflow file: NugetPublish.yml).
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5

      # https://github.com/dotnet-campus/dotnetCampus.TagToVersion
      - name: Install dotnet tool
        run: dotnet tool install -g dotnetCampus.TagToVersion

      - name: Set tag to version
        run: dotnet TagToVersion -t ${{ github.ref }} -f Version.props

      - name: Validate release tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${tag}. Expected vX.Y.Z." >&2
            exit 1
          fi

          tag_version="${tag#v}"
          props_version="$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' Version.props)"
          if [[ "${tag_version}" != "${props_version}" ]]; then
            echo "Release tag version ${tag_version} does not match Version.props version ${props_version}." >&2
            exit 1
          fi

          # The release must have a CHANGELOG.md entry; extracting it both validates the entry exists and
          # proves the release notes are ready.
          ./scripts/extract_changelog.sh "${tag_version}" > /dev/null

          echo "Publishing Milvus.Client / Milvus.Client.V2 ${props_version} from tag ${tag}."

      - name: Build
        run: dotnet build -c Release

      # Pack the two SDK projects explicitly so the examples/test projects are not published as packages.
      - name: Pack
        run: |
          dotnet pack Milvus.Client/Milvus.Client.csproj -c Release -o Artifacts
          dotnet pack Milvus.Client.V2/Milvus.Client.V2.csproj -c Release -o Artifacts

      - name: "NuGet login (Trusted Publishing: OIDC -> temporary API key)"
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to nuget.org
        run: |
          # Push the packages and their symbol packages; *.snupkg (symbols/source-link) are emitted by
          # IncludeSymbols but never matched by *.nupkg, so pushing them explicitly keeps the release complete.
          # --skip-duplicate makes the push idempotent so a re-run after a partial publish (e.g. one package
          # already uploaded) skips the existing version instead of failing the whole job.
          dotnet nuget push Artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push Artifacts/*.snupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    name: Create GitHub release
    needs: publish
    if: needs.publish.result == 'success' && github.repository == 'milvus-io/milvus-sdk-csharp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5

      - name: Prepare release body
        id: release-info
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          release_date="$(date -u +%F)"
          milvus_minor="$(echo "$version" | cut -d. -f1,2)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "milvus_minor=${milvus_minor}" >> "${GITHUB_OUTPUT}"

          changelog="$(./scripts/extract_changelog.sh "${version}")"
          body_file="${RUNNER_TEMP}/release_body.md"
          {
            echo "Release date: ${release_date}"
            echo "Compatible with Milvus v${milvus_minor}.x"
            echo "nuget.org: https://www.nuget.org/packages/Milvus.Client/${version}"
            echo "nuget.org (V2): https://www.nuget.org/packages/Milvus.Client.V2/${version}"
            echo
            printf '%s\n' "${changelog}"
          } > "${body_file}"
          echo "body_path=${body_file}" >> "${GITHUB_OUTPUT}"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: milvus-sdk-csharp-${{ steps.release-info.outputs.version }}
          bodyFile: ${{ steps.release-info.outputs.body_path }}
          draft: false
          allowUpdates: true
          omitNameDuringUpdate: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
