name: Build

on:
  push:
    branches:
    - main
    - 2.6
    - 3.0
  pull_request:

jobs:
  build-v1:
    name: Build and test V1 with Milvus ${{ matrix.milvus_version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        milvus_version: [v2.3.22, v2.4.23, v2.5.20, v2.6.20]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          # global.json targets 8.0; pin it to avoid the MSB3030 apphost bug on the SDK 10 default.
          dotnet-version: 8.0.x

      - name: Build V1 SDK (all target frameworks)
        run: dotnet build Milvus.Client/Milvus.Client.csproj

      - name: Build
        run: dotnet build Milvus.Client.Tests/Milvus.Client.Tests.csproj

      - name: Test
        run: dotnet test Milvus.Client.Tests/Milvus.Client.Tests.csproj --no-build --logger "GitHubActions;report-warnings=false"
        env:
          MILVUS_IMAGE: milvusdb/milvus:${{ matrix.milvus_version }}

  build-v2:
    name: Build and test V2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          # global.json targets 8.0; pin it to avoid the MSB3030 apphost bug on the SDK 10 default.
          dotnet-version: 8.0.x

      - name: Build V2 SDK (all target frameworks)
        run: dotnet build Milvus.Client.V2/Milvus.Client.V2.csproj

      - name: Build examples
        run: dotnet build examples/v2/Milvus.Examples.csproj

      - name: Unit test
        run: dotnet test Milvus.Client.V2.Tests/Milvus.Client.V2.Tests.csproj --filter "Category=Unit" --logger "GitHubActions;report-warnings=false" --collect "XPlat Code Coverage" --settings coverage.runsettings

      - name: Integration test
        run: dotnet test Milvus.Client.V2.Tests/Milvus.Client.V2.Tests.csproj --filter "Category=Integration" --logger "GitHubActions;report-warnings=false" --collect "XPlat Code Coverage" --settings coverage.runsettings

      - name: System test
        run: dotnet test Milvus.Client.V2.Tests/Milvus.Client.V2.Tests.csproj --filter "Category=System" --logger "GitHubActions;report-warnings=false" --collect "XPlat Code Coverage" --settings coverage.runsettings

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          # dotnet test --collect writes coverage under each test project's TestResults folder
          # (Milvus.Client.V2.Tests/TestResults/<run-id>/coverage.cobertura.xml), so match from any depth.
          files: "**/TestResults/**/coverage.cobertura.xml"
          name: v2-coverage
          disable_safe_directory: true
          verbose: true

  build-v2-windows:
    # Windows coverage of the mock-based layers (no container needed): the net462 target actually compiles
    # and the Unit/Integration suites exercise Grpc.Net.Client and path handling on the Windows runtime.
    # System tests need a Linux Milvus container and are therefore only run on the ubuntu job, which also owns
    # the coverage upload (collecting coverage on both OSes would double-count for codecov).
    name: Build and test V2 on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          # global.json targets 8.0; pin it to avoid the MSB3030 apphost bug on the SDK 10 default.
          dotnet-version: 8.0.x

      - name: Build V2 SDK (all target frameworks, incl. net462)
        run: dotnet build Milvus.Client.V2/Milvus.Client.V2.csproj

      - name: Build V1 SDK (all target frameworks, incl. net462)
        run: dotnet build Milvus.Client/Milvus.Client.csproj

      - name: Build examples
        run: dotnet build examples/v2/Milvus.Examples.csproj

      - name: Unit test
        run: dotnet test Milvus.Client.V2.Tests/Milvus.Client.V2.Tests.csproj --filter "Category=Unit" --logger "GitHubActions;report-warnings=false"

      - name: Integration test
        run: dotnet test Milvus.Client.V2.Tests/Milvus.Client.V2.Tests.csproj --filter "Category=Integration" --logger "GitHubActions;report-warnings=false"
